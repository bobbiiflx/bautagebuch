<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bautagebuch</title>
<style>body{margin:0;font:16px -apple-system,BlinkMacSystemFont,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;background:#1670ee;color:#fff;text-align:center;padding:24px}a{color:#fff;font-weight:600}</style>
<script>
// Falsche oder veraltete Adresse (z. B. Lesezeichen auf eine Unterseite): zurück zur App leiten.
(function () {
  var parts = location.pathname.split('/').filter(Boolean);
  var base = location.hostname.endsWith('github.io') && parts.length ? '/' + parts[0] + '/' : '/';
  location.replace(base);
})();
</script>
</head>
<body><div><p>Diese Seite gibt es nicht.</p><p><a href="./">Zum Bautagebuch</a></p></div></body>
</html>
