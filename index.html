<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bautagebuch</title>
  <meta name="theme-color" content="#f6f7f9">
  <meta name="description" content="Privates Bautagebuch mit Kosten, Mängeln, Fortschritt und Dokumenten">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bautagebuch">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script>try{if(localStorage.getItem('bt.splash')==='off')document.documentElement.classList.add('no-splash')}catch(e){}try{var t=localStorage.getItem('bt.theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="sp-grid"></div>
    <div class="sp-in">
      <img class="sp-ic" src="icons/icon-512.png" width="132" height="132" alt="">
      <div class="sp-t">Bautagebuch</div>
      <div class="sp-s">Dein Bauvorhaben im Blick</div>
      <div class="sp-bar"><i></i></div>
    </div>
  </div>
  <div id="app"></div>
  <noscript>Diese App braucht JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
